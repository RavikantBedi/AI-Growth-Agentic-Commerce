<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="AI Merchant Growth & Agentic Checkout — bounded, explainable, auditable commerce for AI buyers. Razorpay test mode."
    />
    <title>AI Merchant Growth &amp; Agentic Checkout</title>
    <script>
      // Apply the theme before first paint. Without this the page renders in
      // one theme and repaints in the other as soon as React hydrates.
      (function () {
        try {
          var pinned = new URLSearchParams(location.search).get("theme");
          var saved = pinned || localStorage.getItem("amg.theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* blocked storage — React applies the theme on mount instead */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
